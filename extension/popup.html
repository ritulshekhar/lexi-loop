<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LexiLoop</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <main class="app">

        <header class="header">

            <div>
                <div class="brand">
                    LexiLoop
                </div>

                <div class="subtitle">
                    Your daily vocabulary loop
                </div>
            </div>

            <div id="date" class="date"></div>

        </header>

        <section class="quick-stats">

            <div class="quick-stat">
                <strong id="new-count">
                    0/3
                </strong>

                <span>
                    learned
                </span>
            </div>

            <div class="quick-stat">
                <strong id="due-count">
                    0
                </strong>

                <span>
                    due
                </span>
            </div>

            <div class="quick-stat">
                <strong id="mastery-score">
                    —
                </strong>

                <span>
                    mastery
                </span>
            </div>

            <div class="quick-stat">
                <strong id="streak">
                    0
                </strong>

                <span>
                    streak
                </span>
            </div>

        </section>

        <section class="section">

            <div class="section-heading">

                <div>
                    <span class="section-label">
                        TODAY
                    </span>

                    <h2>
                        Your 3 words
                    </h2>
                </div>

                <span id="progress-text" class="progress-text">
                    0/3
                </span>

            </div>

            <div id="words-container" class="words-container"></div>

        </section>

        <section id="revision-section" class="section hidden">

            <div class="section-heading">

                <div>
                    <span class="section-label">
                        REVISION
                    </span>

                    <h2>
                        Due now
                    </h2>
                </div>

                <span id="revision-count" class="count-badge">
                    0
                </span>

            </div>

            <div id="revision-container" class="revision-container"></div>

        </section>

        <section id="completion-message" class="completion-message hidden">
            Today's vocabulary is complete ✓
        </section>

        <button id="open-dashboard" class="dashboard-button">
            View detailed progress
        </button>

        <footer class="footer">
            3 words a day • Build vocabulary that sticks
        </footer>

    </main>

    <script src="words.js"></script>
    <script src="vocabulary.js"></script>
    <script src="popup.js"></script>

</body>

</html>

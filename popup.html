<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexiLoop</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <main class="app">
        <header class="header">
            <div>
                <div class="brand">LexiLoop</div>
                <div class="subtitle">Your daily vocabulary loop</div>
            </div>

            <div class="date" id="date"></div>
        </header>

        <section class="progress-section">
            <div class="progress-top">
                <span>Today's progress</span>
                <span id="progress-text">0/3 learned</span>
            </div>

            <div class="progress-track">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </section>

        <div id="completion-message" class="completion-message hidden">
            Nice work. Today's vocabulary is complete.
        </div>

        <section id="words-container" class="words-container"></section>

        <footer class="footer">
            3 words a day • Build vocabulary that sticks
        </footer>
    </main>

    <script src="words.js"></script>
    <script src="popup.js"></script>
</body>

</html>
